# The check contract on GitHub: what `bin/check integrate` runs locally, on every pull request and on main.
# `main` requires this job, so nothing merges without the whole suite green on a clean machine.
# macOS only: on Linux the gardener refuses to run without a systemd private /tmp, which a hosted runner
# does not give, so the Linux paths are proved on the Linux host that runs the gardener, not here.
# Principles: `prove` (the suite on a clean machine before every merge), `doors` (main takes nothing unchecked).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: srt (the gardener's sandbox; the automation suite needs it)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix automation
      - name: bin/check integrate
        run: |
          git config --global user.name "kitchen ci"
          git config --global user.email "ci@users.noreply.github.com"
          bin/check integrate
